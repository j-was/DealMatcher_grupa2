name: Trigger auto deployment for dealmatcher-frontend2

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ release ]
    paths:
    - '**'
    - '.github/workflows/dealmatcher-frontend2-AutoDeployTrigger-4b5d44fe-e601-455f-8152-1b92c845ed96.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.DEALMATCHERFRONTEND2_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.DEALMATCHERFRONTEND2_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DEALMATCHERFRONTEND2_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}src/frontend/DealMatcher.Frontend
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: docker.io
          registryUsername: ${{ secrets.DEALMATCHERFRONTEND2_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.DEALMATCHERFRONTEND2_REGISTRY_PASSWORD }}
          containerAppName: dealmatcher-frontend2
          resourceGroup: pw-dealmatcher
          imageToBuild: pprpjwas/dealmatcher-frontend2:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


