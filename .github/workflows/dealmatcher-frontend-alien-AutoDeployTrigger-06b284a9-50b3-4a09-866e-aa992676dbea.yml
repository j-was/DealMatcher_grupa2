name: Trigger auto deployment for dealmatcher-frontend-alien

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ release ]
    paths:
    - '**'
    - '.github/workflows/dealmatcher-frontend-alien-AutoDeployTrigger-06b284a9-50b3-4a09-866e-aa992676dbea.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.DEALMATCHERFRONTENDALIEN_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.DEALMATCHERFRONTENDALIEN_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DEALMATCHERFRONTENDALIEN_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/src/frontend
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: docker.io
          registryUsername: ${{ secrets.DEALMATCHERFRONTENDALIEN_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.DEALMATCHERFRONTENDALIEN_REGISTRY_PASSWORD }}
          containerAppName: dealmatcher-frontend-alien
          resourceGroup: pw-dealmatcher
          imageToBuild: pprpjwas/dealmatcher-frontend-alien:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


