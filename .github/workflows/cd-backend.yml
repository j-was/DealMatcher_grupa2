name: Backend CD

on:
  workflow_run:
    workflows: ["Develop to release CD"]
    types: [completed]
    branches: [release]
  push:
    branches: [release]
  workflow_dispatch:

jobs:
  check-paths:
    runs-on: ubuntu-latest
    outputs:
      backend-changed: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - "src/backend/**"
              - ".github/workflows/backend-ci.yml"

  build-and-deploy:
    needs: check-paths
    if: needs.check-paths.outputs.backend-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write 
      contents: read 

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.DEALMATCHERBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.DEALMATCHERBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DEALMATCHERBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/src/backend/DealMatcher.Backend
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: docker.io
          registryUsername: ${{ secrets.DEALMATCHERBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.DEALMATCHERBACKEND_REGISTRY_PASSWORD }}
          containerAppName: dealmatcher-backend
          resourceGroup: pw-dealmatcher
          imageToBuild: ${{ secrets.DEALMATCHERBACKEND_REGISTRY_USERNAME }}/dealmatcher-backend:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_
