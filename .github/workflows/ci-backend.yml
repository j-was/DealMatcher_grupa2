name: Backend CI

on:
  push:
    branches: ["develop"]
    paths:
      - "src/backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: ["develop"]
    paths:
      - "src/backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build:
    name: Backend Build & Test (.NET 9)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore dependencies
        working-directory: src/backend/DealMatcher.Backend
        run: dotnet restore DealMatcher.Backend.sln
      - name: Build
        working-directory: src/backend/DealMatcher.Backend
        run: dotnet build --no-restore DealMatcher.Backend.sln
      - name: Test
        working-directory: src/backend/DealMatcher.Backend
        run: dotnet test --no-build --verbosity normal DealMatcher.Backend.sln

  editorconfig:
    name: EditorConfig Checker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Check Dotnet Format
        working-directory: src/backend/DealMatcher.Backend
        run: dotnet tool install -g dotnet-format
      - name: Run Dotnet Format
        working-directory: src/backend/DealMatcher.Backend
        run: dotnet format --severity info --verify-no-changes
