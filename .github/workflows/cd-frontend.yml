name: Frontend CD

on: 
    push:
        branches: [release]
        paths:
            - "src/frontend/**"
            - ".github/workflows/cd-frontend.yml"
    workflow_dispatch:

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout to the branch
              uses: actions/checkout@v2

            - name: Azure login
              uses: azure/login@v2
              with:
                 client-id: ${{ secrets.DEALMATCHERFRONTEND2_AZURE_CLIENT_ID }}
                 tenant-id: ${{ secrets.DEALMATCHERFRONTEND2_AZURE_TENANT_ID }}
                 subscription-id: ${{ secrets.DEALMATCHERFRONTEND2_AZURE_SUBSCRIPTION_ID }}
            
            - name: Build and push container image to registry
              uses: azure/container-apps-deploy-action@v2
              with: 
                appSourcePath: ${{github.workspace}}/src/frontend/DealMatcher.Frontend
                _dockerfilePathKey_: _dockerfilePath_
                _targetLabelKey_: _targetLabel_
                registryUrl: docker.io
                registryUsername: ${{ secrets.DEALMATCHERFRONTEND2_REGISTRY_USERNAME }}
                registryPassword: ${{ secrets.DEALMATCHERFRONTEND2_REGISTRY_PASSWORD }}
                containerAppName: dealmatcher-frontend2
                resourceGroup: pw-dealmatcher
                imageToBuild: ${{ secrets.DEALMATCHERFRONTEND2_REGISTRY_USERNAME }}/dealmatcher-frontend:${{github.sha}}
                _buildArgumentsKey_: API_URL
                _buildArgumentsValues_: ${{ secrets.API_URL }}
